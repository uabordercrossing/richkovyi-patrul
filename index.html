function avatarSvgMarkup(id){
 return AVATARS[id]||AVATARS.soldier_cap;
}
function getDevUser(){
 let id=localStorage.getItem('devUserId');
 if(!id){id=String(900000000+Math.floor(Math.random()*99999999));localStorage.setItem('devUserId',id)}
 return{id:Number(id),first_name:'Тест',last_name:'Гравець #'+id.slice(-4)}
}
async function initCloudProgress(){
 try{
  const tg=window.Telegram&&window.Telegram.WebApp;
  let body;
  if(IS_DEV){
   body={devUser:getDevUser()};
  }else{
   if(!tg||!tg.initData)return;
   tg.ready();
   body={initData:tg.initData};
  }
  const res=await fetch(AUTH_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!res.ok)return;
  const{token,uid,firstName,lastName}=await res.json();
  await firebase.auth().signInWithCustomToken(token);
  cloudUid=uid;
  cloudFirstName=firstName;cloudLastName=lastName;
  const docRef=db.collection('progress').doc(uid);
  const snap=await docRef.get();
  if(snap.exists){
   const data=snap.data();
   if(typeof data.best==='number'&&data.best>best)best=data.best;
   if(typeof data.coins==='number')totalCoins=data.coins;
   cloudDisplayName=data.displayName||'';
   cloudAvatar=data.avatar||'soldier_cap';
   if(data.upgrades)upgrades={weapon:data.upgrades.weapon||0,motor:data.upgrades.motor||0,belt:data.upgrades.belt||0,ammo:data.upgrades.ammo||0,reload:data.upgrades.reload||0};
  }
  applyUpgrades();
  docRef.set({firstName,lastName},{merge:true}).catch(()=>{});
  cloudReady=true;
  updateLbBtn();
 }catch(e){}
}
function updateLbBtn(){
 document.getElementById('lbBtn').style.display=(cloudReady&&over)?'inline-block':'none';
 if(!over)document.getElementById('lbModal').style.display='none';
}
function saveBestToCloud(value){
 if(!cloudReady||!cloudUid)return;
 db.collection('progress').doc(cloudUid).set({best:value,updatedAt:firebase.firestore.FieldValue.serverTimestamp()},{merge:true}).catch(()=>{});
}
function awardCoins(amount){
 if(!cloudReady||!cloudUid||amount<=0)return;
 db.collection('progress').doc(cloudUid).set({coins:firebase.firestore.FieldValue.increment(amount)},{merge:true}).catch(()=>{});
}
const SHOP_TRACKS=[
 {key:'weapon',name:'Зброя',icon:weaponShopIcon,levels:WEAPON_LEVELS,desc:n=>(WEAPON_LEVELS[n].type==='pistol'?'Пістолет':'Автомат')+', радіус '+WEAPON_LEVELS[n].range+'px, кулдаун '+WEAPON_LEVELS[n].cd+'с'},
 {key:'motor',name:'Мотор',icon:SHOP_ICON.motor,levels:MOTOR_LEVELS,desc:n=>'Швидкість ×'+MOTOR_LEVELS[n].speedMul.toFixed(2)+', розрізання '+MOTOR_LEVELS[n].cutTime.toFixed(2)+'с'},
 {key:'belt',name:'Весло',icon:SHOP_ICON.belt,levels:BELT_LEVELS,desc:n=>'Замах '+BELT_LEVELS[n].dur.toFixed(2)+'с, радіус '+BELT_LEVELS[n].radius+'px'},
 {key:'ammo',parent:'weapon',name:'Магазин',icon:SHOP_ICON.ammo,levels:AMMO_LEVELS,desc:n=>'Магазин на '+AMMO_LEVELS[n].capacity+' патронів',lockedIf:()=>upgrades.weapon===0,lockedMsg:'Спочатку купіть зброю'},
 {key:'reload',parent:'weapon',name:'Перезарядка',icon:SHOP_ICON.reload,levels:RELOAD_LEVELS,desc:n=>'Перезарядка '+RELOAD_LEVELS[n].time.toFixed(1)+'с',lockedIf:()=>upgrades.weapon===0,lockedMsg:'Спочатку купіть зброю'}
];
function shopRow(tr){
 const locked=!!(tr.lockedIf&&tr.lockedIf());
 const lvl=upgrades[tr.key],max=tr.levels.length-1,next=lvl+1,maxed=lvl>=max;
 const price=maxed?0:tr.levels[next].cost;
 const descText=locked?tr.lockedMsg:(maxed?'Максимальний рівень':'Наступний рівень: '+tr.desc(next));
 const row=document.createElement('div');
 row.className='shopRow';
 row.innerHTML=`<span class="shopIcon">${typeof tr.icon==='function'?tr.icon():tr.icon}</span><span class="shopInfo"><b>${tr.name} · рівень ${lvl}/${max}</b><span>${descText}</span></span><button class="buyBtn" ${locked||maxed||totalCoins<price?'disabled':''}>${locked?'—':maxed?'Максимум':'+'+price}</button>`;
 if(!locked&&!maxed)row.querySelector('.buyBtn').onclick=()=>buyUpgrade(tr.key);
 return row;
}
function renderShop(){
 document.getElementById('shopCoins').innerHTML='Монети: '+totalCoins;
 const list=document.getElementById('shopList');
 list.innerHTML='';
 for(const tr of SHOP_TRACKS){
  if(tr.parent)continue;
  const kids=SHOP_TRACKS.filter(k=>k.parent===tr.key);
  if(!kids.length){list.appendChild(shopRow(tr));continue}
  const group=document.createElement('div');
  group.className='shopGroup';
  group.appendChild(shopRow(tr));
  const box=document.createElement('div');
  box.className='shopChildren';
  for(const k of kids)box.appendChild(shopRow(k));
  group.appendChild(box);
  list.appendChild(group);
 }
}
function openShop(){document.getElementById('shopModal').style.display='flex';renderShop()}
function buyUpgrade(track){
 const tr=SHOP_TRACKS.find(t=>t.key===track),lvl=upgrades[track],next=lvl+1;
 if(next>=tr.levels.length)return;
 const cost=tr.levels[next].cost;
 if(totalCoins<cost)return;
 totalCoins-=cost;
 upgrades[track]=next;
 applyUpgrades();
 if(cloudReady&&cloudUid){
  const patch={coins:firebase.firestore.FieldValue.increment(-cost),upgrades:{[track]:next}};
  db.collection('progress').doc(cloudUid).set(patch,{merge:true}).catch(()=>{});
 }
 renderShop();
}
function updateShopBtn(){document.getElementById('shopBtn').style.display=(!started||over)?'inline-block':'none'}
function leaderboardName(d){
 return (d.displayName&&d.displayName.trim())||[d.firstName,d.lastName].filter(Boolean).join(' ')||'Гравець'
}
function escapeHtml(s){
 return s.replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))
}
function renderLbRow(rank,d,mine){
 const row=document.createElement('div');
 row.className='row'+(mine?' me':'');
 const rankLabel=rank<=3?`<span class="medal">${medalSvg(rank)}</span>`:String(rank);
 const avatarHtml=`<span class="avatar">${avatarSvgMarkup(d.avatar)}</span>`;
 row.innerHTML=`<span class="left"><span class="rank">${rankLabel}</span>${avatarHtml}<span class="name">${escapeHtml(leaderboardName(d))}${mine?' <small>(ти)</small>':''}</span></span><span>${d.best||0}</span>`;
 return row;
}
function openAvatarPicker(){
 const modal=document.getElementById('avModal'),grid=document.getElementById('avGrid');
 grid.innerHTML='';
 Object.keys(AVATARS).forEach(id=>{
  const cell=document.createElement('button');
  cell.className='avCell'+(id===cloudAvatar?' selected':'');
  cell.innerHTML=avatarSvgMarkup(id);
  cell.onclick=async()=>{
   cloudAvatar=id;
   modal.style.display='none';
   if(cloudReady&&cloudUid){
    try{await db.collection('progress').doc(cloudUid).set({avatar:id},{merge:true})}catch(e){}
   }
   openLeaderboard(true);
  };
  grid.appendChild(cell);
 });
 modal.style.display='flex';
}
function headerRow(){
 const row=document.createElement('div');
 row.className='row headerRow';
 row.innerHTML=`<span class="left"><span class="rank">Ранг</span><span class="avatar"></span><span class="name">Гравець</span></span><span>Бали</span>`;
 return row;
}
const LB_CACHE_MS=60000,LB_RANK_CAP=300;
let lbCache={ts:0,rows:null,rank:null,best:null};
function renderLbFromCache(){
 const list=document.getElementById('lbList');
 list.innerHTML='';
 list.appendChild(headerRow());
 let i=0,foundMe=false;
 lbCache.rows.forEach(({id,data})=>{
  i++;
  if(id===cloudUid)foundMe=true;
  list.appendChild(renderLbRow(i,data,id===cloudUid));
 });
