<!DOCTYPE html>
<html lang="uk"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Річковий патруль</title>
<style>
:root{--bg:#f4f1ea;--fg:#222;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#1b1d21;--fg:#eee}}
:root[data-theme="dark"]{--bg:#1b1d21;--fg:#eee}
html,body{height:100%;margin:0;overflow:hidden}
body{background:var(--bg);color:var(--fg);font-family:system-ui,sans-serif;display:flex;flex-direction:column;align-items:center;justify-content:center}
p{margin:6px;font-size:13px;opacity:.7}
#bar{display:flex;gap:8px;margin:10px 0 14px}button{font-size:18px;padding:3px 10px;border-radius:8px;border:1px solid #8886;background:transparent;color:var(--fg);font-family:inherit}
.btnIcon{display:inline-flex;width:16px;height:16px;vertical-align:-3px;margin-right:4px}
.btnIcon svg,button svg{width:100%;height:100%;display:block}
.iconBtn{display:inline-flex;align-items:center;justify-content:center;width:34px;height:34px;padding:0}
.iconBtn svg{width:18px;height:18px}
.closeX{width:18px;height:18px}
#stage{position:relative;display:block}
#stage canvas{display:block;width:100%;height:100%;touch-action:none;border-radius:10px}
#lbBtn{display:none;position:absolute;left:50%;top:66%;transform:translateX(-50%);font-size:14px;padding:6px 14px;border-radius:20px;border:1px solid rgba(255,255,255,.5);background:rgba(20,30,20,.55);color:#fff;white-space:nowrap}
#lbModal,#avModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;z-index:10}
#avModal{z-index:11}
.card{background:var(--bg);color:var(--fg);width:min(320px,88vw);max-height:80vh;border-radius:12px;padding:16px;display:flex;flex-direction:column;gap:10px}
.card h2{margin:0;font-size:18px}
#lbModal .card{background:linear-gradient(#1c2d4c,#131f36);color:#eef2f8;border:2px solid rgba(255,255,255,.22);box-shadow:0 14px 34px rgba(0,0,0,.5)}
.lbHead{display:flex;align-items:center;gap:8px;padding-bottom:8px;border-bottom:1px solid rgba(255,255,255,.15)}
.lbHead h2{flex:1;text-align:center;font-size:14px;letter-spacing:.08em;text-transform:uppercase}
.closeX{background:none;border:none;color:rgba(255,255,255,.7);padding:0 2px;cursor:pointer;display:inline-flex}
#lbMe{display:none;align-items:center;gap:10px;background:rgba(255,255,255,.08);border-radius:10px;padding:8px 10px}
#lbMe .tryzub{width:24px;height:36px;flex:none;display:block}
#lbMe .avatar{width:34px;height:34px}
#lbMe .txt{display:flex;flex-direction:column;line-height:1.35}
#lbMe .nameLine{display:flex;align-items:center;gap:4px}
#lbMe .txt b{font-size:11px;letter-spacing:.05em;text-transform:uppercase;opacity:.8}
#lbMe .txt span{font-size:15px;font-weight:700}
#lbList{overflow-y:auto;font-size:14px;display:flex;flex-direction:column;gap:2px}
#lbList .row{display:flex;align-items:center;justify-content:space-between;padding:5px 6px;border-radius:8px;gap:8px}
#lbList .row.me{background:#f2c230;color:#1a1f2b}
#lbList .headerRow{font-size:10px;letter-spacing:.06em;text-transform:uppercase;opacity:.55;border-bottom:1px solid rgba(255,255,255,.12);padding-bottom:6px;margin-bottom:2px;border-radius:0}
#lbList .headerRow .avatar{visibility:hidden}
#lbList .sep{text-align:center;opacity:.5;padding:2px 0}
#lbList .left{display:flex;align-items:center;gap:6px;min-width:0}
#lbList .rank{width:30px;text-align:center;flex:none;font-size:13px;font-weight:700;opacity:.9;display:flex;align-items:center;justify-content:center}
#lbList .medal{width:20px;height:24px;display:block}
.editBtn svg{width:14px;height:14px}
#lbList .name,#lbMe .nameLine .name{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
#lbMe .nameLine .name{max-width:150px}
#lbList .name small{opacity:.6;font-weight:400}
.editBtn{background:none;border:none;color:inherit;font-size:13px;padding:0 2px;cursor:pointer;opacity:.75}
.editInput{font-size:13px;padding:3px 6px;border-radius:5px;border:1px solid #8886;background:rgba(255,255,255,.1);color:inherit;width:120px}
.saveBtn,.cancelBtn{background:none;border:none;color:inherit;padding:0 2px;cursor:pointer;display:inline-flex}
.saveBtn svg,.cancelBtn svg{width:15px;height:15px}
.cancelBtn{opacity:.6}
.avatar{width:22px;height:22px;border-radius:50%;flex:none;overflow:hidden;display:inline-flex;padding:0;border:none;background:none}
.avatar svg{width:100%;height:100%;display:block}
button.avatar{cursor:pointer}
#avGrid{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.avCell{padding:0;border:3px solid transparent;border-radius:50%;cursor:pointer;overflow:hidden;background:none;aspect-ratio:1}
.avCell svg{width:100%;height:100%;display:block}
.avCell.selected{border-color:#f2c94c}
#avClose{align-self:flex-end;font-size:14px}
.devBtn{font-size:12px;padding:4px 8px}
#shopBtn{display:none}
#shopModal{display:none;position:fixed;inset:0;background:rgba(0,0,0,.6);align-items:center;justify-content:center;z-index:12}
#shopModal .card{background:linear-gradient(#1c2d4c,#131f36);color:#eef2f8;border:2px solid rgba(255,255,255,.22);box-shadow:0 14px 34px rgba(0,0,0,.5)}
#shopCoins{font-weight:700;padding-bottom:6px;border-bottom:1px solid rgba(255,255,255,.15)}
.shopRow{display:flex;align-items:center;gap:10px;padding:8px 2px;border-bottom:1px solid rgba(255,255,255,.1)}
.shopRow:last-child{border-bottom:none}
.shopIcon{width:28px;height:28px;flex:none}
.shopIcon svg{width:100%;height:100%;display:block}
.shopInfo{flex:1;min-width:0;display:flex;flex-direction:column;gap:2px}
.shopInfo b{font-size:13px}
.shopInfo span{font-size:11px;opacity:.75}
.buyBtn{font-size:12px;padding:5px 9px;white-space:nowrap;color:inherit}
.buyBtn:disabled{opacity:.4}
</style>

function avatarSvgMarkup(id){
 return AVATARS[id]||AVATARS.soldier_cap;
}
function getDevUser(){
 let id=localStorage.getItem('devUserId');
 if(!id){id=String(900000000+Math.floor(Math.random()*99999999));localStorage.setItem('devUserId',id)}
 return{id:Number(id),first_name:'Тест',last_name:'Гравець #'+id.slice(-4)}
}
async function initCloudProgress(){
 try{
  const tg=window.Telegram&&window.Telegram.WebApp;
  let body;
  if(IS_DEV){
   body={devUser:getDevUser()};
  }else{
   if(!tg||!tg.initData)return;
   tg.ready();
   body={initData:tg.initData};
  }
  const res=await fetch(AUTH_ENDPOINT,{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify(body)});
  if(!res.ok)return;
  const{token,uid,firstName,lastName}=await res.json();
  await firebase.auth().signInWithCustomToken(token);
  cloudUid=uid;
  cloudFirstName=firstName;cloudLastName=lastName;
  const docRef=db.collection('progress').doc(uid);
  const snap=await docRef.get();
  if(snap.exists){
   const data=snap.data();
   if(typeof data.best==='number'&&data.best>best)best=data.best;
   if(typeof data.coins==='number')totalCoins=data.coins;
   cloudDisplayName=data.displayName||'';
   cloudAvatar=data.avatar||'soldier_cap';
   if(data.upgrades)upgrades={weapon:data.upgrades.weapon||0,motor:data.upgrades.motor||0,belt:data.upgrades.belt||0,ammo:data.upgrades.ammo||0};
  }
  applyUpgrades();
  docRef.set({firstName,lastName},{merge:true}).catch(()=>{});
  cloudReady=true;
  updateLbBtn();
 }catch(e){}
}
